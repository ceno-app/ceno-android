version: 2
updates:
  # Enable version updates for Gradle
  - package-ecosystem: "gradle"
    # Look for `build.gradle` in the `root` directory
    directory: "/"
    # Check for updates once daily
    schedule:
      interval: "daily"

  # Enable version updates for bundle
  - package-ecosystem: "bundler"
    # Look for `Gemfile.lock` in the `root` directory
    directory: "/"
    # Check for updates once daily
    schedule:
      interval: "daily"
